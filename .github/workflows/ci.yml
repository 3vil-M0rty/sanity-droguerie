# Sanity — automatic checks on every push and pull request.
#
#  backend   unit + route tests (in-memory database), dependency audit
#  frontend  tests + production build, dependency audit
#  real-db   the SAME code against a real MongoDB 7: demo data, server
#            start, smoke test of the main screens, backup → restore
#            → compare (restore drill)
#
# A red check blocks the merge (Settings → Branches → branch protection
# → "Require status checks to pass": backend, frontend, real-db).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Dependency audit (high and critical, production dependencies)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid/api
          VITE_BUILD_ID: ${{ github.sha }}
      - name: Dependency audit (high and critical, production dependencies)
        run: npm audit --omit=dev --audit-level=high

  real-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGODB_URI: mongodb://localhost:27017/sanity_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      PORT: "5055"
      TRUST_PROXY: "0"
      BUILD_ID: ${{ github.sha }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Load the demo data into a real MongoDB
        run: npm run seed
      - name: Start the server
        run: |
          nohup node server.js > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5055/health && exit 0
            sleep 1
          done
          echo "Server did not start"; cat server.log; exit 1
      - name: Smoke test (login + main screens)
        run: npm run smoke -- --url=http://localhost:5055 --email=admin@sanity.test --password=Admin@123
      - name: Restore drill (backup → restore into an empty database → compare)
        run: npm run backup:drill -- --scratch=mongodb://localhost:27017/sanity_ci_restore_drill
      - name: Server log
        if: always()
        run: cat server.log || true
